info:
  name: Set a share's level
  type: http
  seq: 3
  tags:
    - Storage

http:
  method: PUT
  url: "{{baseUrl}}/elements/:id/shares/:recipientId"
  params:
    - name: id
      value: ""
      type: path
    - name: recipientId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "level": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/elements/:id/shares/:recipientId"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
        - name: recipientId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "level": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "elementId": "",
            "recipient": {
              "id": "",
              "username": ""
            },
            "level": ""
          }

docs: Only the owner may grant read or write. Write permits editing contents, not renaming, moving or deleting a shared root. Overlapping grants use the highest level.
