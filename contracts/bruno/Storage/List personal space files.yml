info:
  name: List personal space files
  type: http
  seq: 1
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/spaces/personal/elements"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/spaces/personal/elements"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "size": "",
              "contentType": "",
              "addedAt": "",
              "addedBy": ""
            }
          ]
