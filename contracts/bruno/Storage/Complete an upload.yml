info:
  name: Complete an upload
  type: http
  seq: 12
  tags:
    - Storage

http:
  method: POST
  url: "{{baseUrl}}/uploads/:id/complete"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/uploads/:id/complete"
      method: POST
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "kind": "",
            "name": "",
            "parentId": "",
            "size": "",
            "contentType": "",
            "addedAt": "",
            "addedBy": "",
            "thumbnailState": ""
          }
  - name: 409 Response
    description: Conflict
    request:
      url: "{{baseUrl}}/uploads/:id/complete"
      method: POST
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 409
      statusText: Conflict
      body:
        type: text
        data: ""

docs: Rechecks write access and uploaded size, then conditionally copies the validated object to a private final key. Replaying an upload URL cannot modify confirmed content. A concurrent content change returns 409 source_changed; resend and retry confirmation. A targeted replacement preserves file identity and shares; revoked, read-only or trashed targets cannot be replaced.
