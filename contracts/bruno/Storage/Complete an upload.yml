info:
  name: Complete an upload
  type: http
  seq: 8
  tags:
    - Storage

http:
  method: POST
  url: "{{baseUrl}}/uploads/:id/complete"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/uploads/:id/complete"
      method: POST
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "kind": "",
            "name": "",
            "parentId": "",
            "size": "",
            "contentType": "",
            "addedAt": "",
            "addedBy": ""
          }
