info:
  name: Declare an upload
  type: http
  seq: 11
  tags:
    - Storage

http:
  method: POST
  url: "{{baseUrl}}/uploads"
  headers:
    - name: Origin
      value: ""
      description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
      disabled: true
    - name: X-Shelf-CSRF
      value: ""
      description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
      disabled: true
  body:
    type: json
    data: |-
      {
        "name": "",
        "size": "",
        "contentType": "",
        "parentId": "",
        "onConflict": "",
        "space": "",
        "replaceFileId": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/uploads"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
          disabled: true
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
          disabled: true
      body:
        type: json
        data: |-
          {
            "name": "",
            "size": "",
            "contentType": "",
            "parentId": "",
            "onConflict": "",
            "space": "",
            "replaceFileId": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "method": "",
            "headers": {},
            "partSize": "",
            "parts": [
              {
                "number": "",
                "url": ""
              }
            ],
            "expiresAt": ""
          }
  - name: 401 Response
    description: Invalid/expired/revoked session or credentials, or mixed cookie and Authorization. Rejected web cookies are deleted.
    request:
      url: "{{baseUrl}}/uploads"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
          disabled: true
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
          disabled: true
      body:
        type: json
        data: |-
          {
            "name": "",
            "size": "",
            "contentType": "",
            "parentId": "",
            "onConflict": "",
            "space": "",
            "replaceFileId": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Insufficient access, or missing/invalid Origin or X-Shelf-CSRF on a web unsafe request.
    request:
      url: "{{baseUrl}}/uploads"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
          disabled: true
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
          disabled: true
      body:
        type: json
        data: |-
          {
            "name": "",
            "size": "",
            "contentType": "",
            "parentId": "",
            "onConflict": "",
            "space": "",
            "replaceFileId": ""
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""

docs: |-
  Requires write access to the destination. To replace a specific writable file, including a shared file with a hidden parent, send replaceFileId, size and contentType without name, parentId, space or onConflict. Old content goes to the owner's trash at confirmation.

  Cookie and Authorization together are rejected (401); no credential fallback. Rejected cookies are cleared on 401. Cookies renew only after successful authenticated activity. Web requests (cookie present, and always web login) require exact configured Origin and X-Shelf-CSRF: 1, otherwise 403. No permissive API CORS.
