info:
  name: Get a miniature state and link
  type: http
  seq: 11
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/files/:id/thumbnail"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/files/:id/thumbnail"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "state": "",
            "link": ""
          }

docs: Uses the file's read access. Link is null while pending or unavailable; generation failure never prevents downloading the file.
