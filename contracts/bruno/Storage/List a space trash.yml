info:
  name: List a space trash
  type: http
  seq: 22
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/spaces/:space/trash"
  params:
    - name: space
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/spaces/:space/trash"
      method: GET
      params:
        - name: space
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "element": {
                "id": "",
                "kind": "",
                "name": "",
                "parentId": "",
                "size": "",
                "contentType": "",
                "addedAt": "",
                "addedBy": "",
                "thumbnailState": ""
              },
              "originalParentId": "",
              "originalPath": "",
              "deletedAt": "",
              "deletedBy": ""
            }
          ]
  - name: 401 Response
    description: Invalid/expired/revoked session or credentials, or mixed cookie and Authorization. Rejected web cookies are deleted.
    request:
      url: "{{baseUrl}}/spaces/:space/trash"
      method: GET
      params:
        - name: space
          value: ""
          type: path
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Insufficient access, or missing/invalid Origin or X-Shelf-CSRF on a web unsafe request.
    request:
      url: "{{baseUrl}}/spaces/:space/trash"
      method: GET
      params:
        - name: space
          value: ""
          type: path
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""

docs: Cookie and Authorization together are rejected (401); no credential fallback. Rejected cookies are cleared on 401. Cookies renew only after successful authenticated activity.
