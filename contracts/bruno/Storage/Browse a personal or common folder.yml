info:
  name: Browse a personal or common folder
  type: http
  seq: 26
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/spaces/:space/browse"
  params:
    - name: space
      value: ""
      type: path
    - name: folderId
      value: ""
      type: query
      disabled: true
    - name: sort
      value: ""
      type: query
      disabled: true
    - name: order
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

