docs: |-
  Returns the folder context and children with capabilities, folders first. Space is personal (owned by the account) or common. Omit folderId for the root. Sort is name (default), addedAt or size; order is asc (default) or desc. No server-side filtering.

  Cookie and Authorization together are rejected (401); no credential fallback. Rejected cookies are cleared on 401. Cookies renew only after successful authenticated activity.
