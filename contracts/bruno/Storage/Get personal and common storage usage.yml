info:
  name: Get personal and common storage usage
  type: http
  seq: 2
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/storage/usage"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/storage/usage"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "personalBytes": "",
            "commonBytes": ""
          }

docs: Confirmed file bytes including trash, excluding pending uploads and thumbnails. No quota is applied.
