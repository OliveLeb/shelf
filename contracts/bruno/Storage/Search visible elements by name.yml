info:
  name: Search visible elements by name
  type: http
  seq: 1
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/elements/search"
  params:
    - name: query
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/elements/search"
      method: GET
      params:
        - name: query
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "kind": "",
              "name": "",
              "parentId": "",
              "size": "",
              "contentType": "",
              "addedAt": "",
              "addedBy": "",
              "thumbnailState": ""
            }
          ]
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/elements/search"
      method: GET
      params:
        - name: query
          value: ""
          type: query
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Invalid/expired/revoked session or credentials, or mixed cookie and Authorization. Rejected web cookies are deleted.
    request:
      url: "{{baseUrl}}/elements/search"
      method: GET
      params:
        - name: query
          value: ""
          type: query
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Insufficient access, or missing/invalid Origin or X-Shelf-CSRF on a web unsafe request.
    request:
      url: "{{baseUrl}}/elements/search"
      method: GET
      params:
        - name: query
          value: ""
          type: query
          disabled: true
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""

docs: |-
  Case-insensitive literal substring (1–255 characters, not whitespace-only). Includes personal, common and received shared elements, without trash or duplicates.

  Cookie and Authorization together are rejected (401); no credential fallback. Rejected cookies are cleared on 401. Cookies renew only after successful authenticated activity.
