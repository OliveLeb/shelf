info:
  name: Search visible elements by name
  type: http
  seq: 1
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/elements/search"
  params:
    - name: query
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/elements/search"
      method: GET
      params:
        - name: query
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "kind": "",
              "name": "",
              "parentId": "",
              "size": "",
              "contentType": "",
              "addedAt": "",
              "addedBy": "",
              "thumbnailState": ""
            }
          ]
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/elements/search"
      method: GET
      params:
        - name: query
          value: ""
          type: query
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""

docs: Case-insensitive literal substring (1–255 characters, not whitespace-only). Includes personal, common and received shared elements, without trash or duplicates.
