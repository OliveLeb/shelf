info:
  name: List a folder
  type: http
  seq: 5
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/folders/:id/elements"
  params:
    - name: id
      value: ""
      type: path
    - name: sort
      value: ""
      type: query
      disabled: true
    - name: order
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
