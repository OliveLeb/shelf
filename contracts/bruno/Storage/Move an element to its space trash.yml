info:
  name: Move an element to its space trash
  type: http
  seq: 21
  tags:
    - Storage

http:
  method: DELETE
  url: "{{baseUrl}}/elements/:id"
  headers:
    - name: Origin
      value: ""
      description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
      disabled: true
    - name: X-Shelf-CSRF
      value: ""
      description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
      disabled: true
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{baseUrl}}/elements/:id"
      method: DELETE
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
          disabled: true
        - name: X-Shelf-CSRF
