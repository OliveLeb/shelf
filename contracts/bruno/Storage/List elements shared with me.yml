info:
  name: List elements shared with me
  type: http
  seq: 1
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/shares/received"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/shares/received"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "element": {
                "id": "",
                "kind": "",
                "name": "",
                "parentId": "",
                "size": "",
                "contentType": "",
                "addedAt": "",
                "addedBy": ""
              },
              "owner": {
                "id": "",
                "username": ""
              },
              "level": ""
            }
          ]
