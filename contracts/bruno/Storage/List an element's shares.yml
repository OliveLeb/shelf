info:
  name: List an element's shares
  type: http
  seq: 2
  tags:
    - Storage

http:
  method: GET
  url: "{{baseUrl}}/elements/:id/shares"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/elements/:id/shares"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "elementId": "",
              "recipient": {
                "id": "",
                "username": ""
              },
              "level": ""
            }
          ]
