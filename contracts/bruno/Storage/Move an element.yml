info:
  name: Move an element
  type: http
  seq: 19
  tags:
    - Storage

http:
  method: POST
  url: "{{baseUrl}}/elements/:id/move"
  headers:
    - name: Origin
      value: ""
      description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
      disabled: true
    - name: X-Shelf-CSRF
      value: ""
      description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
      disabled: true
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "parentId": "",
        "space": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/elements/:id/move"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
          disabled: true
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
          disabled: true
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "parentId": "",
            "space": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "kind": "",
            "name": "",
            "parentId": "",
            "size": "",
            "contentType": "",
            "addedAt": "",
            "addedBy": "",
            "thumbnailState": ""
          }
  - name: 401 Response
    description: Invalid/expired/revoked session or credentials, or mixed cookie and Authorization. Rejected web cookies are deleted.
    request:
      url: "{{baseUrl}}/elements/:id/move"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
          disabled: true
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
          disabled: true
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "parentId": "",
            "space": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Insufficient access, or missing/invalid Origin or X-Shelf-CSRF on a web unsafe request.
    request:
      url: "{{baseUrl}}/elements/:id/move"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
          disabled: true
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
          disabled: true
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "parentId": "",
            "space": ""
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""

docs: "Cookie and Authorization together are rejected (401); no credential fallback. Rejected cookies are cleared on 401. Cookies renew only after successful authenticated activity. Web requests (cookie present, and always web login) require exact configured Origin and X-Shelf-CSRF: 1, otherwise 403. No permissive API CORS."
