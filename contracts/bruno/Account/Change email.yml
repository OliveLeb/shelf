info:
  name: Change email
  type: http
  seq: 4
  tags:
    - Account

http:
  method: PATCH
  url: "{{baseUrl}}/account/email"
  body:
    type: json
    data: |-
      {
        "email": "",
        "currentPassword": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/account/email"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "email": "",
            "currentPassword": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "username": "",
            "email": "",
            "isAdmin": false,
            "isActive": false
          }
