info:
  name: Change password
  type: http
  seq: 5
  tags:
    - Account

http:
  method: PATCH
  url: "{{baseUrl}}/account/password"
  body:
    type: json
    data: |-
      {
        "password": "",
        "currentPassword": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{baseUrl}}/account/password"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "password": "",
            "currentPassword": ""
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
