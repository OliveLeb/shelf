info:
  name: Change username
  type: http
  seq: 3
  tags:
    - Account

http:
  method: PATCH
  url: "{{baseUrl}}/account/username"
  body:
    type: json
    data: |-
      {
        "username": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/account/username"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "username": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "username": "",
            "email": "",
            "isAdmin": false,
            "isActive": false
          }
