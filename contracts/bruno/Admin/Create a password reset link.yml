info:
  name: Create a password reset link
  type: http
  seq: 4
  tags:
    - Admin

http:
  method: POST
  url: "{{baseUrl}}/admin/accounts/:id/password-reset"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/admin/accounts/:id/password-reset"
      method: POST
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "expiresAt": "",
            "link": ""
          }
