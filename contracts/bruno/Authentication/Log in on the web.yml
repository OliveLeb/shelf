info:
  name: Log in on the web
  type: http
  seq: 3
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/auth/web/login"
  headers:
    - name: Origin
      value: ""
      description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
    - name: X-Shelf-CSRF
      value: ""
      description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
    - name: X-Shelf-CSRF
      value: "{{apiKey}}"
      description: Value must be exactly 1. Web unsafe requests also require Origin exactly equal to Authentication:ClientOrigin; no permissive CORS is provided.
  body:
    type: json
    data: |-
      {
        "identifier": "",
        "password": "",
        "deviceName": ""
      }
  auth:
    type: apikey
    key: X-Shelf-CSRF
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/auth/web/login"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
        - name: X-Shelf-CSRF
          value: "{{apiKey}}"
          description: Value must be exactly 1. Web unsafe requests also require Origin exactly equal to Authentication:ClientOrigin; no permissive CORS is provided.
      body:
        type: json
        data: |-
          {
            "identifier": "",
            "password": "",
            "deviceName": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "username": "",
            "email": "",
            "isAdmin": false,
            "isActive": false
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/auth/web/login"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
        - name: X-Shelf-CSRF
          value: "{{apiKey}}"
          description: Value must be exactly 1. Web unsafe requests also require Origin exactly equal to Authentication:ClientOrigin; no permissive CORS is provided.
      body:
        type: json
        data: |-
          {
            "identifier": "",
            "password": "",
            "deviceName": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Invalid/expired/revoked session or credentials, or mixed cookie and Authorization. Rejected web cookies are deleted.
    request:
      url: "{{baseUrl}}/auth/web/login"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
        - name: X-Shelf-CSRF
          value: "{{apiKey}}"
          description: Value must be exactly 1. Web unsafe requests also require Origin exactly equal to Authentication:ClientOrigin; no permissive CORS is provided.
      body:
        type: json
        data: |-
          {
            "identifier": "",
            "password": "",
            "deviceName": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Insufficient access, or missing/invalid Origin or X-Shelf-CSRF on a web unsafe request.
    request:
      url: "{{baseUrl}}/auth/web/login"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
        - name: X-Shelf-CSRF
          value: "{{apiKey}}"
          description: Value must be exactly 1. Web unsafe requests also require Origin exactly equal to Authentication:ClientOrigin; no permissive CORS is provided.
      body:
        type: json
        data: |-
          {
            "identifier": "",
            "password": "",
            "deviceName": ""
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
  - name: 429 Response
    description: Too Many Requests
    request:
      url: "{{baseUrl}}/auth/web/login"
      method: POST
      headers:
        - name: Origin
          value: ""
          description: Exactly Authentication:ClientOrigin. Required with a web cookie and always for web login. Missing, null or foreign origins are rejected.
        - name: X-Shelf-CSRF
          value: ""
          description: Exactly 1. Required with a web cookie and always for web login; not required for Bearer-only mobile requests.
        - name: X-Shelf-CSRF
          value: "{{apiKey}}"
          description: Value must be exactly 1. Web unsafe requests also require Origin exactly equal to Authentication:ClientOrigin; no permissive CORS is provided.
      body:
        type: json
        data: |-
          {
            "identifier": "",
            "password": "",
            "deviceName": ""
          }
    response:
      status: 429
      statusText: Too Many Requests
      body:
        type: text
        data: ""

docs: |-
  Returns Account only, never the token or session envelope. Sets __Host-shelf-session (HttpOnly; Secure; SameSite=Strict; Path=/; no Domain), expiring with the 30-day sliding inactivity window. A successful login atomically revokes any session identified by the previous web cookie, including on account switch.

  Cookie and Authorization together are rejected (401); no credential fallback. Rejected cookies are cleared on 401. Cookies renew only after successful authenticated activity. Web requests (cookie present, and always web login) require exact configured Origin and X-Shelf-CSRF: 1, otherwise 403. No permissive API CORS.
