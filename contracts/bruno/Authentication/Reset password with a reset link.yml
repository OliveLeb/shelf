info:
  name: Reset password with a reset link
  type: http
  seq: 3
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "token": "",
        "password": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{baseUrl}}/auth/reset-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "",
            "password": ""
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
