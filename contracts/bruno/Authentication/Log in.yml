info:
  name: Log in
  type: http
  seq: 2
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "identifier": "",
        "password": "",
        "deviceName": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "identifier": "",
            "password": "",
            "deviceName": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": {
              "id": "",
              "username": "",
              "email": "",
              "isAdmin": false,
              "isActive": false
            },
            "sessionId": "",
            "token": "",
            "expiresAt": ""
          }
