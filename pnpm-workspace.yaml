packages:
  - apps/web
  - apps/mobile
  - packages/*

catalogMode: strict

catalog:
  '@capacitor/cli': ^8.5.3
  '@capacitor/core': ^8.5.3
  '@iconify-json/lucide': ^1.2.147
  '@nuxt/ui': ^4.12.0
  '@vitejs/plugin-basic-ssl': ^2.3.0
  '@vitejs/plugin-vue': ^6.0.10
  '@vue/test-utils': ^2.5.1
  '@vue/tsconfig': ^0.9.1
  happy-dom: ^21.0.4
  pinia: ^4.1.0
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vue: ^3.5.44
  vue-router: ^5.0.0
  vue-tsc: ^3.3.13

# Plugins and libraries importing `vite` get the Vite+ core, as Vite+ requires.
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# Dependency install scripts allowed to run (pnpm blocks the others).
allowBuilds:
  esbuild: true
  vue-demi: true
