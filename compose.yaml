name: shelf

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelf}
      POSTGRES_USER: ${POSTGRES_USER:-shelf}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # MinIO upstream images are no longer published; Chainguard rebuilds MinIO from source.
    image: chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  # Node.js toolchain for apps/web, apps/mobile and packages/* (profile "front").
  # One-off commands: docker compose run --rm node pnpm install
  node: &node
    profiles: [front]
    build: infra/node
    image: shelf-node:dev
    volumes:
      - .:/workspace
      - node_cache:/home/node/.cache
    command: pnpm install

  web:
    <<: *node
    command: pnpm --filter @shelf/web dev --host 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"

  mobile:
    <<: *node
    command: pnpm --filter @shelf/mobile dev --host 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  postgres_data:
  minio_data:
  node_cache:
