name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Disposable local services; these are not production credentials.
  MINIO_ROOT_USER: shelf
  MINIO_ROOT_PASSWORD: ci-only-s3-password
  SHELF_TEST_POSTGRES: Host=127.0.0.1;Username=shelf;Database=postgres
  SHELF_TEST_S3_ENDPOINT: http://127.0.0.1:9000
  SHELF_TEST_S3_ACCESS_KEY: shelf
  SHELF_TEST_S3_SECRET_KEY: ci-only-s3-password

jobs:
  backend:
    name: Backend and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Keep this job present on every PR so a required check never stays pending.
      - name: Detect backend changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: bash .github/scripts/ci-scope.sh

      - name: Set up .NET and cache NuGet packages
        if: steps.scope.outputs.backend == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # global.json allows the latest .NET 10 feature band.
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: apps/backend/**/packages.lock.json

      - name: Restore locked dependencies
        if: steps.scope.outputs.backend == 'true'
        run: dotnet restore apps/backend/Shelf.slnx --locked-mode

      - name: Install miniature decoders
        if: steps.scope.outputs.backend == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg imagemagick libheif1 libheif-plugin-libde265
          convert -list format | grep -E 'HEIC.*r'

      - name: Build once in Release
        if: steps.scope.outputs.backend == 'true'
        run: dotnet build apps/backend/Shelf.slnx --configuration Release --no-restore

      - name: Set up Node.js and cache Bruno downloads
        if: steps.scope.outputs.backend == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contracts/generate.sh

      - name: Verify generated API contracts
        if: steps.scope.outputs.backend == 'true'
        run: |
          ./contracts/generate.sh --no-build
          if [[ -n "$(git status --porcelain -- contracts/openapi.json contracts/bruno)" ]]; then
            git diff --stat -- contracts/openapi.json contracts/bruno
            echo '::error::API contracts are stale. Run ./contracts/generate.sh and commit the result.'
            exit 1
          fi

      - name: Start integration services
        if: steps.scope.outputs.backend == 'true'
        run: |
          docker compose up --detach --wait --wait-timeout 90
          # Compose has a PostgreSQL healthcheck; MinIO also needs to accept S3 requests.
          if docker compose config --services | grep -qx minio; then
            curl --fail --silent --show-error --retry 30 --retry-connrefused \
              --retry-delay 1 --retry-max-time 60 --max-time 2 \
              http://127.0.0.1:9000/minio/health/ready
          fi

      - name: Run integration tests without rebuilding
        if: steps.scope.outputs.backend == 'true'
        run: >-
          dotnet test apps/backend/Shelf.slnx
          --configuration Release --no-build --no-restore
          --logger trx --results-directory "${{ runner.temp }}/test-results"
          --blame-hang-timeout 2m

      - name: Show service logs on failure
        if: failure() && steps.scope.outputs.backend == 'true'
        run: docker compose logs --no-color --tail 100

      - name: Upload failure diagnostics
        if: failure() && steps.scope.outputs.backend == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-failure-diagnostics
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop integration services
        if: always() && steps.scope.outputs.backend == 'true'
        run: docker compose down --volumes --remove-orphans

      - name: Report documentation-only change
        if: steps.scope.outputs.backend == 'false'
        run: echo 'No backend or CI changes; expensive checks skipped.' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Keep this job present on every PR so a required check never stays pending.
      - name: Detect frontend changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: bash .github/scripts/ci-scope.sh

      # Same Node.js version as the infra/node development image.
      - name: Set up Node.js
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install locked dependencies
        if: steps.scope.outputs.frontend == 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format, lint, build and type-check
        if: steps.scope.outputs.frontend == 'true'
        run: pnpm check

      - name: Run unit tests
        if: steps.scope.outputs.frontend == 'true'
        run: pnpm test

      - name: Report skipped frontend checks
        if: steps.scope.outputs.frontend == 'false'
        run: echo 'No frontend or CI changes; frontend checks skipped.' >> "$GITHUB_STEP_SUMMARY"
